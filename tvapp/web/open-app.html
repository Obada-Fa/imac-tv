<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111d"><title>Nexus TV</title>
<style>
:root{color-scheme:dark;--accent-rgb:158,204,255}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#0b111d;color:#eef3fb;
  font-family:Inter,"SF Pro Text",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif}
main{width:100%;max-width:380px;text-align:center}
.mark{width:64px;height:64px;margin:0 auto 22px;border-radius:20px;display:grid;place-items:center;
  background:rgba(var(--accent-rgb),.12);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.25),0 0 28px rgba(var(--accent-rgb),.22)}
.mark svg{width:32px;height:32px;fill:none;stroke:#9eccff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;font-weight:600;margin:0 0 8px}
p{margin:0 0 28px;color:#9aa7b8;font-size:15px;line-height:1.45}
a{display:block;text-decoration:none;border-radius:16px;padding:15px;font-size:16px;font-weight:600}
.app{color:#fff;background:linear-gradient(180deg,rgba(var(--accent-rgb),.34),rgba(var(--accent-rgb),.16));border:1px solid rgba(var(--accent-rgb),.7)}
.web{margin-top:10px;color:#c9d4e3;font-weight:500}
</style></head>
<body><main>
<div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 20h8"/></svg></div>
<h1>Opening the Nexus TV app…</h1>
<p>If the app doesn't open, open it below or continue in your browser.</p>
<a class="app" href="{{INTENT}}">Open in the app</a>
<a class="web" href="{{WEB}}">Continue in browser</a>
</main>
<script>location.replace(document.querySelector('.app').href)</script>
</body></html>
