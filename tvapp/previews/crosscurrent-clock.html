<script>
(() => {
  const root = document.getElementById('crosscurrent-preview');
  const input = root.querySelector('input');
  const output = root.querySelector('output');
  const svg = root.querySelector('svg');
  const wet = root.querySelector('.wet');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const namespace = 'http://www.w3.org/2000/svg';
  function shape(group, type, attrs) {
    const el = document.createElementNS(namespace, type);
    for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
    group.appendChild(el);
    return el;
  }
  // Hour, then the two river bends on the way to its successor.
  const sites = [
    [94,102, 131,66, 173,95], [196,62, 218,31, 237,88],
    [298,83, 359,98, 386,31], [459,53, 517,77, 528,60],
    [617,93, 682,121, 655,164], [548,161, 494,154, 499,118],
    [443,138, 392,143, 383,199], [320,190, 277,184, 270,142],
    [219,154, 154,167, 140,226], [203,246, 281,283, 324,205],
    [419,255, 477,311, 522,264], [552,282, 648,380, -43,349]
  ];
  let seed = 8642;
  function random() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const routes = sites.map(([x,y,a,b,c,d], i) => {
    const [nx,ny] = sites[(i + 1) % sites.length];
    const path = shape(root.querySelector('.riverbed'), 'path', {
      d:'M'+x+' '+y+' C'+a+' '+b+' '+c+' '+d+' '+nx+' '+ny,
      fill:'none', stroke:'#d6d6bb','stroke-width':1,'stroke-opacity':.36
    });
    const length = path.getTotalLength();
    const points = Array.from({length:121}, (_, j) => path.getPointAtLength(length*j/120));
    return {path, points, length};
  });
  const stones = sites.map(([x,y],i) => {
    const group = shape(root.querySelector('.landmarks'), 'g', {transform:'translate('+x+' '+y+')'});
    const r = 17 + random()*3;
    const corners = Array.from({length:6}, (_, j) => {
      const angle = j*Math.PI/3 + (random()-.5)*.34;
      const radius = r*(.86 + random()*.25);
      return [Math.cos(angle)*radius*1.18,Math.sin(angle)*radius];
    });
    const stone = shape(group,'polygon',{points:corners.join(' '),stroke:'#fff3ce','stroke-width':1});
    const num = shape(group,'text',{x:0,y:1,'dominant-baseline':'central','text-anchor':'middle',
      'font-family':'system-ui,sans-serif','font-size':21,'font-weight':500});
    num.textContent = i || 12;
    return {stone,num};
  });
  // One seeded school. Offsets and size vary independently, leaving gaps and little clumps.
  const chips = Array.from({length:34}, (_,i) => {
    const loose = i >= 24;
    const size = loose ? 1.9+random()*3.5 : 2.1+random()*4.3;
    const el = shape(root.querySelector('.debris'),'polygon',{
      points:[[-size,-size*.45],[size*.8,-size*.8],[size*1.3,size*.2],[-size*.2,size*.68]].join(' '),
      fill:loose ? '#d5d0b8' : ['#f9de94','#c8eeeb','#f6a774','#fff3d6'][i%4],
      opacity:loose ? .25+random()*.35 : .8+random()*.2
    });
    return {el,loose,phase:random()*6.28,rate:.4+random()*.7,offset:(random()-.5)*35,
      tail:random()**1.4*.45, x:40+random()*640, y:44+random()*255};
  });
  let hour, fraction;
  function position(relative) {
    const idx = (hour + Math.floor(relative) + 12) % 12;
    const samples = routes[idx].points;
    const u = (relative - Math.floor(relative))*120;
    const j = Math.min(119,Math.floor(u));
    const a = samples[j], b = samples[j+1], mix = u-j;
    return {x:a.x+(b.x-a.x)*mix,y:a.y+(b.y-a.y)*mix,angle:Math.atan2(b.y-a.y,b.x-a.x)};
  }
  function draw(t) {
    for (const chip of chips) {
      const wave = t * chip.rate + chip.phase;
      let x, y, rotation;
      if (chip.loose) {
        x = chip.x + 11*Math.sin(wave);
        y = chip.y + 7*Math.cos(wave*.83);
        rotation = 40*Math.sin(wave*.7);
      } else {
        const p = position(fraction - chip.tail + .025*Math.sin(wave));
        const offset = chip.offset + 5*Math.sin(wave*1.3);
        x = p.x - Math.sin(p.angle)*offset;
        y = p.y + Math.cos(p.angle)*offset;
        rotation = p.angle*180/Math.PI + 28*Math.sin(wave);
      }
      chip.el.setAttribute('transform','translate('+x.toFixed(2)+' '+y.toFixed(2)+') rotate('+rotation.toFixed(1)+')');
    }
  }
  function select() {
    const minute = Number(input.value);
    hour = Math.floor(minute/60);
    fraction = (minute%60)/60;
    const time = (hour || 12)+':'+String(minute%60).padStart(2,'0');
    output.value = time;
    input.setAttribute('aria-valuetext',time);
    svg.setAttribute('aria-label','Crosscurrent at '+time+'. Fragments flow from '+(hour||12)+' toward '+((hour+1)%12||12)+'.');
    for (const [i,{stone,num}] of stones.entries()) {
      stone.setAttribute('fill',i===hour ? '#ffe9a9' : '#252c2c');
      stone.setAttribute('stroke-opacity',i===hour ? 1 : .32);
      num.setAttribute('fill',i===hour ? '#24291f' : '#dfdfd1');
    }
    const route = routes[hour];
    wet.setAttribute('d',route.path.getAttribute('d'));
    wet.setAttribute('stroke-dasharray',(route.length*fraction)+' '+(route.length+1));
    draw(performance.now()/1000);
  }
  let visible = false, timer;
  function schedule() {
    clearInterval(timer);
    if (visible && !document.hidden && !reduced.matches) {
      timer = setInterval(() => draw(performance.now()/1000),1000/15);
    }
  }
  input.addEventListener('input',select);
  new IntersectionObserver(([entry]) => { visible=entry.isIntersecting; schedule(); }).observe(root);
  reduced.addEventListener('change',schedule);
  document.addEventListener('visibilitychange',schedule);
