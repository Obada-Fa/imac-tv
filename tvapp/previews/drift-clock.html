<script>
(() => {
  const root = document.getElementById('drift-minute');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const replay = root.querySelector('button');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  // Sample the pen strokes once. Each light follows its own short stretch.
  const strokes = {
    two: 'M3 24 C9 3 36 3 35 19 C34 32 7 43 2 58 Q17 54 34 57',
    one: 'M9 22 Q22 14 28 7 L20 57',
    four: 'M31 6 Q15 24 3 39 Q20 38 38 37 M30 22 L24 58',
    seven: 'M4 12 Q19 8 38 10 Q23 30 11 58',
    eight: 'M23 31 C-2 20 16 3 29 8 C49 16 23 30 15 34 C-8 48 9 64 24 56 C42 46 34 37 23 31'
  };
  function sample(d) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    const length = path.getTotalLength();
    return Array.from({length: 256}, (_, i) => path.getPointAtLength(length * i / 255));
  }
  const curves = Object.fromEntries(Object.entries(strokes).map(([k, d]) => [k, sample(d)]));
  const clamp = value => Math.min(1, Math.max(0, value));
  const smooth = value => value * value * (3 - 2 * value);
  const point = (curve, fraction) => curve[Math.round(clamp(fraction) * 255)];
  function dot(x, y, radius, alpha, color) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 2 * Math.PI);
    ctx.fill();
  }
  const groups = [['two', 14, 28], ['one', 57, 16], ['four', 120, 28], ['seven', 167, 30]];
  function draw(t) {
    ctx.setTransform(canvas.width / 220, 0, 0, canvas.height / 88, 0, 0);
    ctx.clearRect(0, 0, 220, 88);
    for (const [key, left, count] of groups) {
      for (let i = 0; i < count; i++) {
        const phase = i * 2.4 + left;
        const u = (i + 0.42 * Math.sin(t * 0.85 + phase)) / (count - 1);
        const p = point(curves[key], u);
        const q = key === 'seven' ? point(curves.eight, u) : p;
        const f = key === 'seven' ? smooth(clamp((t - 1.9 - i * 0.012) / 1.65)) : 0;
        const sweep = Math.sin(f * Math.PI);
        const x = left + p.x + (q.x - p.x) * f + 8 * sweep * Math.sin(phase);
        const y = 9 + p.y + (q.y - p.y) * f - sweep * (7 + 3 * Math.cos(phase));
        const light = 0.81 + 0.18 * Math.sin(phase + t);
        const tail = point(curves[key], u - 0.013);
        const nextTail = key === 'seven' ? point(curves.eight, u - 0.013) : tail;
        const dx = (p.x - tail.x) * (1 - f) + (q.x - nextTail.x) * f;
        const dy = (p.y - tail.y) * (1 - f) + (q.y - nextTail.y) * f;
        // Keep the lift between the two strokes of the 4.
        if (Math.hypot(dx, dy) < 6) dot(x - dx, y - dy, 0.72, 0.35 * light, '#accfff');
        dot(x, y, 2.3, 0.10 * light, '#9bbdff');
        dot(x, y, i % 4 === 0 ? 1.14 : 0.83, light, '#e7f5ff');
      }
    }
    for (const y of [33, 49]) dot(107, y, 1.15, 0.8, '#e0edff');
    for (let i = 0; i < 12; i++) {
      dot((i * 61 + 6 + t * 0.8) % 220, 8 + (i * 37) % 71 + 2 * Math.sin(i + t * 0.4),

  }

  let visible = false;

    previous = performance.now();

  }

    elapsed = reduced.matches ? (elapsed < 3 ? 6 : 0) : 0;

    schedule();
  });

    schedule();
  }

    visible = entry.isIntersecting;
    schedule();
  }).observe(root);

  preference();
})();
</script>
