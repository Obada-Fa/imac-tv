<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Circuit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
  .bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
        opacity: 0; transition: opacity 2.8s ease-in-out; will-change: opacity; }
  .bg.on { opacity: 1; }
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #viz { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<img class="bg" id="bg0" alt="">
<img class="bg" id="bg1" alt="">
<div id="dim"></div>
<canvas id="viz"></canvas>
<script src="data.js"></script>
<script src="levels.js"></script>
<script src="circuit.js"></script>
<script src="main.js"></script>
</body>
</html>
